<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | ACME, Inc</title>
</head>
<body>
    <h1>Inicio</h1>
    <!-- a para enlaces (elemento tipo en línea)-->

    <!-- Enlaces dentro del mismo sitio web -->
    <a href="productos.html">Ir a Productos</a>
    <a href="contacto.html">Ir a Contacto</a>
    
    <!-- #id para ir a una parte en específico del sitio web, la parte seleccionada debe tener el mismo ID que el puesto en # -->
    <a href="contacto.html#cookies">Política de Cookies</a>
    
    <!-- ENLACES FUERA DEL SITIO WEB -->
    <a href="https://github.com">Acceder a GITHUB</a>
    <!-- "target='_blank'" atributo para abrir otra ventana al dirigirse al enlace-->
    <a href="https://developers.google.com" target="_blank" rel="noopener">Acceder a Google Developers</a>
    
    <!-- ENLACES A RECURSOS -->
    <!-- / para ir a un archivo de la carpeta seleccionada, en este caso "docs". Prueba, no existe el archivo-->
    <a href="docs/demo.pdf">Visualizar Doc en pdf</a>
    <!-- si el archivo no se puede leer, el navegador lo descargará -->
    <a href="docs/demo.docs">Visualizar Doc en Word</a>
    <a href="docs/demo.zip">Descargar archivo</a>
    
    <!-- "download" atributo para forzar la descarga del archivo-->
    <a href="docs/demo.pdf" download>Visualizar Doc en pdf</a>

    <!-- ENLACES CON PREFIJOS -->
    <!-- tel: para llamar -->
    <a href="tel:+51987654321">Pulse aquí para llamarnos</a>
    <!-- mailto:  para mandar un correo hacia el seleccionado-->
    <a href="mailto:info@acme.com">info@acme.com</a>
</body>
</html>

<!-- Para copiar una linea debajo de otra, SHIFT + ALT + flecha abajo -->
