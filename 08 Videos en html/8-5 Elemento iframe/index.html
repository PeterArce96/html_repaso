<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemento iFrame</title>
</head>
<body>
    <iframe src="./mensaje.html" title="Mensaje" width="440" height="340"></iframe>
    <iframe width="560"
            height="315"
            src="https://www.youtube.com/embed/ELSm-G201Ls?si=DUM_voHFgd7SgmIu"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>

    <!-- src link del video
        title titulo del video
        frameborder 0 para que no se note el borde
        allow para diferentes atributos para dispositivos mobiles
        allowfullscreen para permitir ver en pantalla completa-->
</body>
</html>
