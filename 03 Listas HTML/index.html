<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas en HTML</title>
</head>
<body>
    
    <!-- LISTAS DESORDENADAS -->
    <!-- "ul" unordered list, listas desordenadas-->
    <!-- "type" atributo para cambiar el simbolo de la lista (disc-square-circle)-->
    <ul type="circle">
        <li>Real Madrid</li>
        <li>FC Barcelona</li>
        <li>At. Madrid</li>
        <li>Getáfe</li>
    </ul>

    <!-- LISTAS ORDENADAS -->
    <!-- "ol" ordered list, listas ordenadas -->
    <!-- atributo type para modificar lista alfanumerica, numeros romanos -->
    <ol type="I">
        <li>
            Nueva York
            <!-- podemos agregar una lista dentro de otra -->
            <ul>
                <li>Manhattan</li>
                <li>Bronx</li>
                <li>Brooklyn</li>
            </ul>
        </li>
        <li>Bogotá</li>
        <li>Lima</li>
        <li>Montevideo</li>
    </ol>
</body>
</html>
