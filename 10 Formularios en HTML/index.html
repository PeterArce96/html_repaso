<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML 1</title>
</head>
<body>
    <!-- Formulario estándar o básico -->
    <!-- form para formulario -->
    <form>
        <!-- label etiqueta para describir el campo -->
        <label for="user">Usuario</label>
        <input type="text" id="user">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass">

        <input type="submit" value="Iniciar sesion">
    </form>

    <hr>
    <!-- Formulario de búsqueda sin botón -->
    <form>
        <!-- placeholder atributo para colocar un texto que luego se borra cuando el usuario escriba dentro del input -->
        <input type="search" placeholder="Buscar...">
    </form>

    <hr>
    <!-- Formulario con campo numérico -->
    <form>
        <label for="cantidad">Cantidad</label>
        <!-- max y min para colocarle un #maximo y minimo 
        step para avanzar o bajar de cantidad en cantidad-->
        <input type="number" id="cantidad" max="10" min="0" step="2">
        <input type="submit" value="Añadir">
    </form>

    <hr>
    <!-- Formulario con campo de fechas -->
    <form>
        <label for="fecha">Fecha de Nacimiento</label>
        <input type="date" id="fecha" min="1900-01-01" max="2050-12-31">
        <input type="submit" value="añadir">
    </form>

    <hr>
    <!-- Formulario con Radiobuttons -->
    <!-- name atributo para agrupar inputs, que solo se pueda marcar una de las opciones-->
    <form>
        <label for="hombre">Hombre</label>
        <input type="radio" value="hombre" name="sexo" id="hombre">
        <label for="mujer">Mujer</label>
        <input type="radio" value="mujer" name="sexo" id="mujer">
        <label for="nc">Prefiero no contestar</label>
        <input type="radio" value="nc" name="sexo" id="nc">
    </form>

    <hr>
    <!-- Formulario con input embebido dentro del label -->
    <!-- Se coloca el input dentro del label para que no sea necesario poner un for -->
    <form action>
        <label>
            <input type="radio" value="futbol" name="deporte">
            Futbol
        </label>
        <label>
            <input type="radio" value="futbol" name="deporte">
            Baloncesto
        </label>
    </form>

    <hr>
    <!-- Formulario con input checkbox -->
    <form>
        <label>
            Pintura
            <!-- checked para que aparezca ya marcado -->
            <input type="checkbox" name="pintura" value="si" checked>
        </label>
        <label>
            Escultura
            <input type="checkbox" name="escultura" value="si">
        </label>
        <label>
            Literatura
            <input type="checkbox" name="literatura" value="si">
        </label>
    </form>

    <!-- RADIOBUTTON uso cuando se necesita marcar 1 de las opciones
    CHECKBOX uso cuando se necesita marcas más de 1 opción-->
</body>
</html>
